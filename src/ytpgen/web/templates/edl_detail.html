{% extends "base.html" %}
{% block title %}{{ name }} — ytpgen{% endblock %}
{% block content %}
<h1>{{ name }}</h1>
<form method="post" action="{{ url_for('edl_save', name=name) }}">
  <textarea name="content" rows="24" spellcheck="false">{{ content }}</textarea>
  <button type="submit">Save</button>
</form>
<form method="post" action="{{ url_for('edl_render', name=name) }}"
      onsubmit="this.querySelector('button').disabled=true">
  <button type="submit">Render to {{ rendered }}</button>
</form>
<p class="muted">{{ name }}</p>
<p><a href="{{ url_for('edl_list') }}">&larr; all EDLs</a></p>
{% endblock %}
