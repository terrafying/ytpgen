<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ytpgen{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --err: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px; line-height: 1.5; margin: 0;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; gap: 1.25rem; align-items: center;
    padding: 0.75rem 1.25rem; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: bold; color: var(--text); }
  nav a { margin-right: 0.9rem; color: var(--dim); }
  nav a:hover, nav a.active { color: var(--accent); }
  main { max-width: 1100px; margin: 1.25rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; margin: 0.5rem 0 1rem; }
  h2 { font-size: 1rem; margin: 1.25rem 0 0.5rem; color: var(--dim); }
  table { border-collapse: collapse; margin: 0.5rem 0; }
  th, td { border: 1px solid var(--border); padding: 0.3rem 0.7rem; text-align: left; }
  th { color: var(--dim); font-weight: normal; background: var(--panel); }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 6px; padding: 1rem; margin: 1rem 0; }
  .flash { padding: 0.55rem 0.9rem; border-radius: 6px; margin: 0.5rem 0;
           border: 1px solid var(--border); }
  .flash.ok { color: var(--ok); border-color: var(--ok); }
  .flash.error { color: var(--err); border-color: var(--err); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem;
    font-family: inherit; font-size: 13px;
  }
  textarea { min-height: 10rem; }
  input[type=number] { width: 8rem; }
  .wordlist { display: flex; flex-wrap: wrap; gap: 0.3rem 0.55rem; }
  .wordlist a { border: 1px solid var(--border); border-radius: 4px;
                padding: 0.1rem 0.45rem; background: var(--panel); }
  .pager { margin-top: 0.75rem; display: flex; gap: 0.75rem; align-items: center; }
  video { max-width: 320px; border: 1px solid var(--border); border-radius: 4px; }
  .empty { color: var(--dim); font-style: italic; }
  button {
    background: #238636; color: white; border: none; border-radius: 6px;
    padding: 0.45rem 1rem; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button:hover { background: #2ea043; }
  button.secondary { background: #21262d; border: 1px solid var(--border); }
  .muted { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 10px;
           font-size: 11px; border: 1px solid var(--border); }
  .badge-queued { color: var(--dim); }
  .badge-running { color: var(--warn); border-color: var(--warn); }
  .badge-done { color: var(--ok); border-color: var(--ok); }
  .badge-error { color: var(--err); border-color: var(--err); }
  .pref-star { color: var(--warn); }
  video.preview { max-width: 320px; max-height: 180px; display: block; }
  .joblog { background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; padding: 0.6rem; font-size: 12px;
            max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  .checkline { display: block; margin: 0.15rem 0; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <span class="brand">ytpgen</span>
  <nav>
    <a href="{{ url_for('dashboard') }}">library</a>
    <a href="{{ url_for('generate') }}">generate</a>
    <a href="{{ url_for('auto') }}">auto</a>
    <a href="{{ url_for('words') }}">words</a>
    <a href="{{ url_for('edl_list') }}">edls</a>
    <a href="{{ url_for('jobs') }}">jobs</a>
  </nav>
  <span class="muted" style="margin-left:auto">{{ workspace_name }}</span>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
