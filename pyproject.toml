[project]
name = "ytpgen"
version = "0.1.0"
description = "YouTube Poop generator: bulk acquire, segment, phoneme-analyze, and compose videos"
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.10.0",
  "faster-whisper>=1.0.0",
  "phonemizer-fork>=3.3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
bench = ["allosaurus>=0.4.0", "soundfile>=0.12", "numpy>=1.26"]
web = ["flask>=3.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
ytp = "ytpgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytpgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
